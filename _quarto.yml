project:
  type: website
  output-dir: docs
  # Only .qmd files are pages. Keeps README/AGENTS/CLAUDE out of the public site.
  render:
    - "*.qmd"
  resources:
    - CNAME
    - .nojekyll

website:
  title: "Max Posch"
  search: false
  description: "Max Posch — Lecturer (Assistant Professor) in Economics, University of Exeter. Political economy, economic development, economic history, and cultural evolution."
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: talks.qmd
        text: Talks
      - href: files/CV-Max-Posch.pdf
        text: CV
        target: _blank
    right:
      - icon: envelope
        href: mailto:m.posch@exeter.ac.uk
        aria-label: Email
  page-footer:
    center: "Max Posch · m.posch@exeter.ac.uk"

format:
  html:
    theme: [cosmo, custom.scss]
    grid:
      body-width: 1000px
    toc: false
    link-external-newwindow: true
